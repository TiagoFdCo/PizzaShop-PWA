server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # O service worker (e o manifest) do PWA NUNCA podem entrar na regra de
    # cache longo abaixo: sw.js termina em .js e seria pego pelo regex,
    # ficando marcado como "immutable" por 1 ano. Aí o navegador nunca mais
    # rebaixa o service worker pra checar se há uma versão nova — cada
    # `docker-compose up --build` gera um sw.js diferente no servidor, mas o
    # navegador segue rodando o primeiro que já tinha em cache, servindo o
    # precache antigo (inclusive o CSS/paleta antigos) pra sempre.
    # location com "=" tem prioridade sobre o regex abaixo, então a ordem
    # aqui não importa, mas deixamos em cima por clareza.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        expires off;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache";
        expires off;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # Assets com cache longo (Vite já adiciona hash no nome)
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Todas as rotas -> index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
