[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# A URL real vem de app.core.config.settings (lida do .env) dentro de
# alembic/env.py — este valor aqui é só um fallback, nunca é o usado de fato.
sqlalchemy.url = postgresql+psycopg2://pizzashop:pizzashop@localhost:5432/pizzashop

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
